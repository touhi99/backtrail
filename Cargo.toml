[package]
name = "backtrail"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ureq = { version = "3", default-features = false, features = ["json"] }
