<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="1100" height="490" role="img" aria-label="Backtrail components">
<style>
:root{--bg:#f7f7f8;--panel:#ffffff;--raised:#f0f0f3;--line:#d4d4dc;--ink:#111114;--soft:#3a3a42;--mut:#6b6b75;--accent:#059669;--blue:#2563eb;--amber:#b45309;--violet:#7c3aed}
@media (prefers-color-scheme: dark){:root{--bg:#0d0d0f;--panel:#131315;--raised:#1a1a1e;--line:#2e2e35;--ink:#f4f4f5;--soft:#c4c4cc;--mut:#8b8b95;--accent:#34d399;--blue:#60a5fa;--amber:#fbbf24;--violet:#c084fc}}
.bg{fill:var(--bg)}
.box{fill:var(--raised);stroke:var(--line)}
.core{fill:var(--panel);stroke:var(--accent);stroke-width:1.4}
.chip{fill:var(--raised);stroke:var(--line)}
.ext{fill:none;stroke:var(--mut);stroke-dasharray:4 4}
.t{fill:var(--ink);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.s{fill:var(--mut);font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.c2{fill:var(--ink);font:500 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.c{fill:var(--soft);font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.l{fill:var(--mut);font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.g{fill:var(--mut);font:600 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.08em}
.edge{stroke:var(--mut);stroke-width:1.2;fill:none}
.hot{stroke:var(--accent)}
.head{fill:var(--mut)}
.headhot{fill:var(--accent)}
.tbl{fill:var(--panel);stroke:var(--c)}
.bar{fill:var(--c)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headhot" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="1100" height="490" rx="14"/>
<rect class="ext" x="270" y="24" width="170" height="44" rx="9"/><text class="t" x="355" y="51" text-anchor="middle">Agent sessions</text><rect class="ext" x="465" y="24" width="170" height="44" rx="9"/><text class="t" x="550" y="51" text-anchor="middle">Notes</text><rect class="ext" x="660" y="24" width="170" height="44" rx="9"/><text class="t" x="745" y="51" text-anchor="middle">Git repos</text><path class="edge" d="M355,68 V126" marker-end="url(#a)"/><path class="edge" d="M550,68 V126" marker-end="url(#a)"/><path class="edge" d="M745,68 V126" marker-end="url(#a)"/><text class="l" x="560" y="102">read</text><rect class="box" x="20" y="130" width="200" height="150" rx="10"/><text class="t" x="36" y="156">Coding agent</text><text class="s" x="36" y="186">session start → brief</text><text class="s" x="36" y="212">each prompt → recall</text><text class="s" x="36" y="238">session end → model jobs</text><path class="edge hot" d="M220,205 H256" marker-end="url(#h)"/><text class="l" x="226" y="196">hooks</text><rect class="core" x="260" y="130" width="580" height="236" rx="12"/><text class="t" x="280" y="158">Backtrail core</text><rect class="chip" x="280" y="174" width="174" height="38" rx="7"/><text class="c2" x="367.0" y="198" text-anchor="middle">Ingest</text><rect class="chip" x="463" y="174" width="174" height="38" rx="7"/><text class="c2" x="550.0" y="198" text-anchor="middle">Search</text><rect class="chip" x="646" y="174" width="174" height="38" rx="7"/><text class="c2" x="733.0" y="198" text-anchor="middle">Claims</text><rect class="chip" x="280" y="220" width="174" height="38" rx="7"/><text class="c2" x="367.0" y="244" text-anchor="middle">Knowledge graph</text><rect class="chip" x="463" y="220" width="174" height="38" rx="7"/><text class="c2" x="550.0" y="244" text-anchor="middle">Resolution</text><rect class="chip" x="646" y="220" width="174" height="38" rx="7"/><text class="c2" x="733.0" y="244" text-anchor="middle">Step closing</text><rect class="chip" x="280" y="266" width="174" height="38" rx="7"/><text class="c2" x="367.0" y="290" text-anchor="middle">Shipped-work check</text><rect class="chip" x="463" y="266" width="174" height="38" rx="7"/><text class="c2" x="550.0" y="290" text-anchor="middle">Recall and brief</text><rect class="chip" x="646" y="266" width="174" height="38" rx="7"/><text class="c2" x="733.0" y="290" text-anchor="middle">Health check</text><rect class="chip" x="280" y="312" width="540" height="38" rx="7"/><text class="c2" x="550.0" y="336" text-anchor="middle">API server</text><rect class="box" x="880" y="130" width="200" height="120" rx="10"/><text class="t" x="896" y="156">Model jobs</text><text class="s" x="896" y="186">extract</text><text class="s" x="896" y="208">resolve</text><text class="s" x="896" y="230">confirm finished steps</text><path class="edge" d="M840,170 H876" marker-end="url(#a)"/><text class="l" x="846" y="163">input</text><path class="edge" d="M876,230 H844" marker-end="url(#a)"/><text class="l" x="846" y="248">results</text><rect class="ext" x="880" y="290" width="200" height="44" rx="9"/><text class="t" x="980" y="317" text-anchor="middle">Language model</text><path class="edge" d="M980,250 V286" marker-end="url(#a)"/><rect class="box" x="260" y="420" width="190" height="44" rx="10"/><text class="t" x="355" y="447" text-anchor="middle">SQLite</text><rect class="ext" x="465" y="420" width="170" height="44" rx="9"/><text class="t" x="550" y="447" text-anchor="middle">Embedding model</text><rect class="ext" x="660" y="420" width="170" height="44" rx="9"/><text class="t" x="745" y="447" text-anchor="middle">GitHub</text><path class="edge hot" d="M355,366 V416" marker-end="url(#h)"/><text class="l" x="362" y="396">only writer</text><path class="edge" d="M550,366 V416" marker-end="url(#a)"/><path class="edge" d="M745,366 V416" marker-end="url(#a)"/><text class="l" x="752" y="396">PR and push state</text><rect class="box" x="20" y="320" width="200" height="44" rx="10"/><text class="t" x="120" y="347" text-anchor="middle">Web app</text><rect class="box" x="20" y="380" width="200" height="44" rx="10"/><text class="t" x="120" y="407" text-anchor="middle">Mac app</text><path class="edge" d="M220,342 H238 V331 H256" marker-end="url(#a)"/><path class="edge" d="M220,402 H238 V331"/><text class="l" x="226" y="320">HTTP</text>
</svg>
