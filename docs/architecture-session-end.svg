<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Session end: Claude Code starts session-end.sh, which runs ingest and embed against the backtrail binary; embed calls the embedding server and results are written to backtrail.db.">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
  .sys { fill: #e3edfa; stroke: #1d5fb8; stroke-width: 1.4; }
  .ext { fill: #eceef2; stroke: #8f98a6; stroke-width: 1.2; }
  .dat { fill: #e0f2e8; stroke: #23804f; stroke-width: 1.4; }
  .opt { fill: #fbe6de; stroke: #b4421f; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .t { fill: #1b1f26; font-size: 13px; font-weight: 600; }
  .r { fill: #4b5260; font-size: 11px; }
  .life { stroke: #8f98a6; stroke-width: 1.2; stroke-dasharray: 3 4; }
  .ln { stroke: #626a77; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .lb { fill: #ffffff; }
  .ah { fill: #626a77; }
  @media (prefers-color-scheme: dark) {
    .bg, .lb { fill: #0d1117; }
    .sys { fill: #1b2d45; stroke: #6aa8f5; } .ext { fill: #21262d; stroke: #6a7380; }
    .dat { fill: #1a3226; stroke: #5dbf8a; } .opt { fill: #3d2219; stroke: #f08a66; }
    .t { fill: #e6edf3; } .r { fill: #b4bcc8; } .life { stroke: #6a7380; }
    .ln { stroke: #9aa2ae; } .ah { fill: #9aa2ae; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
