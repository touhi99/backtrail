<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Overview: a browser and coding-agent hooks use one backtrail binary, which reads source files, writes one SQLite file and optionally calls a local embedding server; helper scripts call the agent CLI and write back through the binary.">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
  .sys { fill: #e3edfa; stroke: #1d5fb8; stroke-width: 1.4; }
  .ext { fill: #eceef2; stroke: #8f98a6; stroke-width: 1.2; }
  .own { fill: #fbefd6; stroke: #a86a08; stroke-width: 1.4; }
  .dat { fill: #e0f2e8; stroke: #23804f; stroke-width: 1.4; }
  .opt { fill: #fbe6de; stroke: #b4421f; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .bound { fill: none; stroke: #8f98a6; stroke-width: 1.2; stroke-dasharray: 6 5; }
  .t { fill: #1b1f26; font-size: 13px; font-weight: 600; }
  .s { fill: #626a77; font-size: 11px; }
  .m { fill: #626a77; font-size: 10.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .r { fill: #626a77; font-size: 11px; font-style: italic; }
  .bl { fill: #626a77; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; }
  .ln { stroke: #8f98a6; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .lno { stroke: #8f98a6; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ah); }
  .ah { fill: #8f98a6; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .sys { fill: #1b2d45; stroke: #6aa8f5; }
    .ext { fill: #21262d; stroke: #6a7380; }
    .own { fill: #3a2e16; stroke: #e0a64a; }
    .dat { fill: #1a3226; stroke: #5dbf8a; }
    .opt { fill: #3d2219; stroke: #f08a66; }
    .bound { stroke: #6a7380; }
    .t { fill: #e6edf3; }
    .s, .m, .r, .bl { fill: #9aa2ae; }
    .ln, .lno { stroke: #6a7380; }
    .ah { fill: #6a7380; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="900" height="470"/>

<!-- boundary -->
<rect class="bound" x="215" y="20" width="470" height="262" rx="14"/>
<text class="bl" x="231" y="42">BACKTRAIL BINARY (RUST)</text>

<!-- external actors -->
<rect class="own" x="30" y="60" width="150" height="64" rx="10"/>
<text class="t" x="105" y="88" text-anchor="middle">Browser</text><text class="s" x="105" y="105" text-anchor="middle">web app</text>
<rect class="ext" x="720" y="60" width="150" height="64" rx="10"/>
<text class="t" x="795" y="88" text-anchor="middle">Coding agent</text><text class="s" x="795" y="105" text-anchor="middle">SessionStart, SessionEnd</text>

<!-- inside binary -->
<rect class="sys" x="235" y="64" width="140" height="84" rx="10"/>
<text class="t" x="305" y="90" text-anchor="middle">HTTP server</text><text class="s" x="305" y="108" text-anchor="middle">JSON API, app files</text><text class="m" x="305" y="126" text-anchor="middle">127.0.0.1:8799</text>
<rect class="sys" x="388" y="64" width="140" height="84" rx="10"/>
<text class="t" x="458" y="90" text-anchor="middle">Command line</text><text class="s" x="458" y="108" text-anchor="middle">ingest, search, brief,</text><text class="s" x="458" y="122" text-anchor="middle">add, embed, kg, check</text>
<rect class="sys" x="541" y="64" width="130" height="84" rx="10"/>
<text class="t" x="606" y="90" text-anchor="middle">Timer thread</text><text class="s" x="606" y="108" text-anchor="middle">every 5 minutes:</text><text class="s" x="606" y="122" text-anchor="middle">rescan, backup, embed</text>
<rect class="sys" x="235" y="172" width="436" height="86" rx="10"/>
<text class="t" x="453" y="196" text-anchor="middle">Store functions</text>
<text class="s" x="453" y="216" text-anchor="middle">write rule for facts, knowledge graph, search ranking,</text>
<text class="s" x="453" y="232" text-anchor="middle">source readers, embedding client</text>
<path class="ln" d="M305,148 L305,172"/><path class="ln" d="M458,148 L458,172"/><path class="ln" d="M606,148 L606,172"/>

<!-- actors to binary -->
<path class="ln" d="M180,92 L215,92"/><text class="r" x="36" y="146">http, loopback only</text>
<path class="ln" d="M720,92 L685,92"/><text class="r" x="694" y="146">command line</text>

<!-- store -->
<rect class="dat" x="285" y="330" width="336" height="76" rx="10"/>
<text class="t" x="453" y="356" text-anchor="middle">backtrail.db (SQLite)</text>
<text class="s" x="453" y="376" text-anchor="middle">sources, chunks, fts, vec, claims, threads, log, overrides,</text>
<text class="s" x="453" y="392" text-anchor="middle">entities and their link tables</text>
<path class="ln" d="M453,282 L453,330"/><text class="r" x="463" y="312">only writer</text>
<rect class="dat" x="285" y="426" width="160" height="32" rx="8"/><text class="s" x="365" y="446" text-anchor="middle">config.json, per machine</text>
<rect class="dat" x="461" y="426" width="160" height="32" rx="8"/><text class="s" x="541" y="446" text-anchor="middle">daily backups</text>

<!-- sources -->
<rect class="ext" x="30" y="190" width="150" height="84" rx="10"/>
<text class="t" x="105" y="216" text-anchor="middle">Sources</text>
<text class="s" x="105" y="234" text-anchor="middle">session logs, notes,</text><text class="s" x="105" y="248" text-anchor="middle">git history,</text><text class="s" x="105" y="262" text-anchor="middle">artifact snapshots</text>
<path class="ln" d="M215,222 L180,222"/><text class="r" x="182" y="214">read only</text>

<!-- embedding server -->
<rect class="opt" x="720" y="190" width="150" height="84" rx="10"/>
<text class="t" x="795" y="216" text-anchor="middle">Embedding server</text><text class="s" x="795" y="234" text-anchor="middle">local Ollama, optional</text><text class="m" x="795" y="252" text-anchor="middle">127.0.0.1:11434</text>

<!-- scripts and model -->
<rect class="ext" x="720" y="330" width="150" height="56" rx="10"/>
<text class="t" x="795" y="356" text-anchor="middle">skill/*.sh</text><text class="s" x="795" y="373" text-anchor="middle">extract, hooks</text>
<rect class="opt" x="720" y="410" width="150" height="48" rx="10"/>
<text class="t" x="795" y="432" text-anchor="middle">Model provider</text><text class="s" x="795" y="447" text-anchor="middle">through the agent CLI</text>
<path class="lno" d="M795,386 L795,410"/>
<text class="r" x="662" y="322">writes through the binary</text>

<path class="lno" d="M685,230 L720,230"/>
<path class="ln" d="M720,350 C690,350 660,320 645,282"/>
<!-- legend -->
<text class="bl" x="30" y="318">KEY</text>
<rect class="own" x="30" y="330" width="14" height="14" rx="3"/><text class="s" x="52" y="342">person</text>
<rect class="sys" x="110" y="330" width="14" height="14" rx="3"/><text class="s" x="132" y="342">backtrail code</text>
<rect class="ext" x="30" y="354" width="14" height="14" rx="3"/><text class="s" x="52" y="366">outside, read or run</text>
<rect class="dat" x="30" y="378" width="14" height="14" rx="3"/><text class="s" x="52" y="390">stored data</text>
<rect class="opt" x="30" y="402" width="14" height="14" rx="3"/><text class="s" x="52" y="414">optional, sends text out</text>
<path class="lno" d="M30,436 L60,436"/><text class="s" x="68" y="440">optional call</text>
</svg>
