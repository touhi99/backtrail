<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Tables: indexed text (sources, chunks, fts, vec), items (nodes, links) and the knowledge graph (entities, entity_aliases, claims, claim_about, claim_evidence), with the keys that join them.">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; }
  .s { fill: #e0f2e8; stroke: #23804f; stroke-width: 1.4; }
  .n { fill: #e3edfa; stroke: #1d5fb8; stroke-width: 1.4; }
  .k { fill: #fbefd6; stroke: #a86a08; stroke-width: 1.4; }
  .hd { fill: #1b1f26; font-size: 12.5px; font-weight: 600; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .c { fill: #4b5260; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .grp { fill: #626a77; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; }
  .r { fill: #626a77; font-size: 10.5px; font-style: italic; }
  .rule { stroke: #8f98a6; stroke-width: 1; opacity: .5; }
  .ln { stroke: #8f98a6; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
  .ah { fill: #8f98a6; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .s { fill: #1a3226; stroke: #5dbf8a; }
    .n { fill: #1b2d45; stroke: #6aa8f5; }
    .k { fill: #3a2e16; stroke: #e0a64a; }
    .hd { fill: #e6edf3; } .c { fill: #b4bcc8; } .grp, .r { fill: #9aa2ae; }
    .rule, .ln { stroke: #6a7380; } .ah { fill: #6a7380; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
